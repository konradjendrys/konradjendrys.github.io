name: Aktualizacja kursu MA

on:
  schedule:
    # 21:30 UTC w dni robocze, czyli po zamknieciu sesji w Nowym Jorku
    - cron: "30 21 * * 1-5"
  workflow_dispatch:        # pozwala uruchomic recznie z zakladki Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zaleznosci
        run: pip install yfinance

      - name: Pobranie kursu
        run: python scripts/fetch_price.py

      - name: Zapis zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ma.json
          git diff --staged --quiet || git commit -m "Aktualizacja kursu MA"
          git push
